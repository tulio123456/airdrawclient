<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0f">
  <title>AirDraw • TULIO</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>

  <canvas id="drawCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>

  <header>
    <div class="brand glass">
      <span class="brandIcon">A</span>

      <div>
        <b>AirDraw</b>
        <small>POWERED BY TULIO</small>
      </div>
    </div>

    <div class="statuses">
      <div id="aiStatus" class="status glass">
        <i></i>
        <span>IA aguardando</span>
      </div>

      <div id="handStatus" class="status glass">
        <i></i>
        <span>Sem mão</span>
      </div>

      <div id="photoStatus" class="status photo glass">
        <i></i>
        <span>Fotos desligadas</span>
      </div>
    </div>
  </header>

  <!-- mantenha aqui o restante do seu HTML -->

</main>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
